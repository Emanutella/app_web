<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
<form action="" method="get">
    <h2>Exercício 1</h2>
    <br>
  <label>
    Nome:
  <input name="form_nome" type="text" placeholder="Digite seu nome aqui" required>
  </label>

  <br>
  <br>

  <label>
      Email:
      <input name="form_email" type="text" placeholder="Digite seu endereço de email aqui" required>
  </label>
  <br>
  <br>
   <label>
      Destinatário:
      <input name="form_destinatario" type="text" placeholder="Digite o endereço de email aqui" required>
  </label>

  <br>
  <br>

  <label>
    Assunto:
  <input name="assunto_nome" type="text">
  </label>

  <br>
  <br>

  <label>
      Digite abaixo:
    <br>
    <textarea rows="10" cols="50"> </textarea>
  </label>
  <br>
  <br>
  <button type="submit">Enviar</button>
  <button type="reset">Limpar</button>

</form>
</body>
</html>
