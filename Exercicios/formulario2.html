<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario2</title>
</head>
<body>
<form action="" method="get">
    <h2>Exercício 2</h2>
    <br>
 <label>
    Nome do produto:
  <input name="form_nome" type="text" required>
  </label>

  <br>
  <br>

  <label>
      Descrição do produto:
    <br>
    <textarea rows="10" cols="50" required> </textarea>
  </label>

 <br>
 <br>

  <label>Categoria do produto:</label>

 <br>
 <br>

 <label>
  Higiene
  <input name="form_P" value="1" type="radio">
</label>
  <br>
  <br>
  <label>
  Alimentação
  <input name="form_s" value="2" type="radio">
</label>
  <br>
  <br>
  <label>
  Brinquedos
  <input name="form_d" value="3" type="radio">
</label>

    <br>
    <br>
    <br>

  <label>País de fabricação:</label>

 <br>
 <br>

 <label>
  Brasil
  <input name="form_BRA" value="1" type="radio">
</label>
  <br>
  <br>
  <label>
  China
  <input name="form_CHINA" value="2" type="radio">
</label>
  <br>
  <br>
  <label>
  EUA
  <input name="form_EUA" value="3" type="radio">
</label>

 <br>
 <br>

  <label>
    Preço do produto:
  <input name="form_preco" type="text" required>
  </label>

  <br>
  <br>

   <label>
    Data de fabricação:
    <input name="form_data_de_fabricacao" type="date">
  </label>

 <br>
 <br>
 <button type="submit">Registrar</button>
 <button type="reset">Limpar</button>
</form>
</body>
</html>
