<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario3</title>
</head>
<body>
<form action="" method="get">
      <h2>Exercício 3</h2>
    <br>

    <label>
        Empresa:
        <input name="form_empresa" type="text" required>
    </label>

  <br>
  <br>

    <label>
        Idade:
        <select name="form_idade" required>
            <option value="10_20">10-20 anos</option>
            <option value="20_30">20-30 anos</option>
            <option value="30_40">30-40 anos</option>
            <option value="40_50">40-50 anos</option>
        </select>
    </label>

    <br>
    <br>

    <label>
        Email:
        <input name="form_email" type="text" required>
    </label>

  <br>
  <br>

    <label>
        Telefone comercial:
        <input name="form_telefone" type="text" required>
    </label>

    <label>
        Celular:
        <input name="form_celular" type="text" required>
    </label>

  <br>
  <br>

    <label>
        Como você avalia os nossos serviços atualmente?
        <select name="form_1p" required>
            <option value="regular">Regular</option>
            <option value="bom">Bom</option>
            <option value="ex">Excelente</option>
        </select>
    </label>

    <br>
    <br>

    <label>
        Como você avalia serviços da área operacional?
        <select name="form_2p"required>
            <option value="regular">Regular</option>
            <option value="bom">Bom</option>
            <option value="ex">Excelente</option>
        </select>
    </label>

    <br>
    <br>

    <label>
        Qual o nível de satisfação com o atendimento administrativo quando você precisa?
        <select name="form_3p" required>
            <option value="regular">Regular</option>
            <option value="bom">Bom</option>
            <option value="ex">Excelente</option>
        </select>
    </label>

    <br>
    <br>

    <label>
        Os profissionais lhe atendendem de forma satisfatória?
        <select name="form_4p" required>
            <option value="regular">SIM</option>
            <option value="bom">NÃO</option>
        </select>
    </label>

    <br>
    <br>

  <label>
      Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos os nossos serviços?:
    <br>
    <textarea rows="10" cols="50"> </textarea>
  </label>
  <br>
  <br>
  <button type="submit">Enviar</button>
  <button type="reset">Limpar</button>




</form>
</body>
</html>
